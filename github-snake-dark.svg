:root {
  --cb: #1b1f230a;
  --cs: purple;
  --ce: #161b22;
  --c0: #161b22;

  /* Tons dourados para a cobrinha */
  --c1: #FFD700;
  --c2: #FFC107;
  --c3: #FFA000;
  --c4: #FF8F00;

  /* Novo tom de verde para o fundo com grade */
  --grid-bg: #0d3312;
  --grid-line: #1f5d27;
}

/* Corpo com plano de fundo em grade */
body {
  margin: 0;
  background-color: var(--grid-bg);
  background-image: 
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 20px 20px;
  font-family: sans-serif;
  height: 100vh;
}

/* Exemplo de cobrinha com pixels dourados */
.snake-segment {
  width: 20px;
  height: 20px;
  background-color: var(--c1);
  border: 1px solid var(--c4);
  box-shadow: 
    0 0 5px var(--c2),
    inset 0 0 3px var(--c3);
}

/* Exemplo: cabeça da cobrinha */
.snake-head {
  background-color: var(--c2);
  box-shadow: 
    0 0 7px var(--c1),
    inset 0 0 5px var(--c4);
}
